services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: timp_server
    ports:
      - "33333:33333"
    volumes:
      - server_data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SHA512:test' | nc -q1 localhost 34943"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  server_data: